name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SimKredit-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release APK
        run: |
          TAG="v1.0-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "SimKredit $TAG" --notes "APK debug SimKredit full offline (rate bawaan + tombol Sync)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
